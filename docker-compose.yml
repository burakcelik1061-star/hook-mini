name: hook-mini

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookmini
      POSTGRES_PASSWORD: hookmini
      POSTGRES_DB: hookmini
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookmini -d hookmini"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and exits; api and worker start only after it succeeded.
  migrate:
    build: .
    image: hook-mini:dev
    command: ["migrate"]
    environment: &app-env
      DATABASE_URL: postgres://hookmini:hookmini@postgres:5432/hookmini?sslmode=disable
      LOG_FORMAT: text
      # Off by default: endpoints may not point at private addresses. The demo
      # receiver lives on the Docker network (a private address), so the demo
      # turns this on: ALLOW_PRIVATE_DESTINATIONS=true docker compose --profile demo up -d
      ALLOW_PRIVATE_DESTINATIONS: ${ALLOW_PRIVATE_DESTINATIONS:-false}
      # Encrypts the endpoint signing secrets stored in the database. Required,
      # with no default on purpose; put it in a .env file next to this one:
      #   echo "SECRET_ENCRYPTION_KEYS=$(openssl rand -base64 32)" > .env
      # Left empty, migrate refuses to run (and api and worker wait for it),
      # while commands that need only postgres keep working.
      SECRET_ENCRYPTION_KEYS: ${SECRET_ENCRYPTION_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: hook-mini:dev
    command: ["api"]
    environment:
      <<: *app-env
      # Each tenant's request budget on /v1 (per api instance); 0 = no limit.
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    # Docker sends SIGKILL after 10s by default, which would cut the graceful
    # shutdown (SHUTDOWN_TIMEOUT, 20s by default) short. Keep this above it.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: hook-mini:dev
    command: ["worker"]
    # Above SHUTDOWN_TIMEOUT (see api), so attempts in flight can finish and
    # be recorded instead of being killed and retried.
    stop_grace_period: 30s
    environment:
      <<: *app-env
      # Overridable from the shell for demos, e.g.
      # DELIVERY_BACKOFF_INITIAL=1s DELIVERY_MAX_ATTEMPTS=3 docker compose up -d
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-60s}
      DELIVERY_TIMEOUT: ${DELIVERY_TIMEOUT:-15s}
      DELIVERY_BACKOFF_INITIAL: ${DELIVERY_BACKOFF_INITIAL:-30s}
      DELIVERY_BACKOFF_MAX: ${DELIVERY_BACKOFF_MAX:-6h}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-8}
      ENDPOINT_AUTO_DISABLE_AFTER: ${ENDPOINT_AUTO_DISABLE_AFTER:-100}
      # Most attempts one worker has in flight to any one endpoint (0 = no cap).
      WORKER_MAX_PER_ENDPOINT: ${WORKER_MAX_PER_ENDPOINT:-3}
      # How long finished deliveries and events are kept (0 = forever, else at
      # least 24h), and how often the worker deletes what has expired.
      RETENTION_PERIOD: ${RETENTION_PERIOD:-2160h}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Development-only webhook endpoint that logs what it receives. Start it
  # with `docker compose --profile demo up -d` and register
  # http://receiver:9000/anything (or /status/503 to watch retries). Set
  # RECEIVER_SECRETS to an endpoint's secret to have signatures verified.
  receiver:
    build:
      context: .
      target: receiver
    image: hook-mini-receiver:dev
    profiles: ["demo"]
    environment:
      RECEIVER_SECRETS: ${RECEIVER_SECRETS:-}
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  pgdata:
