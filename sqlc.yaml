version: "2"
sql:
  - engine: postgresql
    # sqlc reads the goose migrations directly (it understands the
    # "-- +goose Down" marker), so the schema has a single source of truth.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          # Secrets must never reach a response by accident: if a handler
          # marshals a store struct directly, these fields are left out.
          - column: "endpoints.secret"
            go_struct_tag: 'json:"-"'
          - column: "api_keys.key_hash"
            go_struct_tag: 'json:"-"'
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
