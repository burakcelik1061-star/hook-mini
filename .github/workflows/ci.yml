name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookmini
          POSTGRES_PASSWORD: hookmini
          POSTGRES_DB: hookmini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookmini -d hookmini"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://hookmini:hookmini@127.0.0.1:5432/hookmini?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # Fails if someone edited a migration or query without regenerating
      # internal/store: generated code must always match its SQL.
      - name: sqlc is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      # -race needs cgo, which Windows dev machines lack; CI is where it runs.
      # The database tests run here against the real Postgres service above.
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hook-mini .
